<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img"><title>Following an automation to its output</title><rect width="960" height="240" rx="12" fill="#101d2b"/><text x="26" y="29" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#79d4c7" font-weight="700">RECONSTRUCTED INTEGRATION TRACE</text><text x="26" y="67" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" fill="#ffffff" font-weight="700">Following an automation to its output</text><path d="M26 85H934 M472 98V188" stroke="#3e5262"/><text x="26" y="113" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#9cbbbb" font-weight="400">n8n → ComfyUI</text><text x="26" y="148" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#fff" font-weight="700">Submit a JSON request</text><text x="26" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#dfeaf0" font-weight="400">Observe the returned job identifier</text><text x="502" y="113" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#9cbbbb" font-weight="400">Filesystem check</text><text x="502" y="148" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#fff" font-weight="700">Locate the saved image</text><text x="502" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#dfeaf0" font-weight="400">Verify that the job produced a deliverable</text><rect x="0" y="199" width="960" height="41" fill="#172a38"/><text x="26" y="225" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#dfeaf0" font-weight="400">The job identifier confirms acceptance; the file check confirms output.</text></svg>